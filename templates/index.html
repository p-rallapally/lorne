<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lorne</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f4ef; color: #171717; }
      header, main { width: min(1100px, calc(100% - 2rem)); margin: auto; }
      header { padding: 3rem 0 1.5rem; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); }
      header p { color: #666; }
      form { display: grid; grid-template-columns: repeat(6, 1fr); gap: .75rem; margin-bottom: 2rem; }
      label { display: grid; gap: .35rem; color: #555; font-size: .8rem; }
      input, select, button { width: 100%; padding: .75rem; border: 1px solid #ccc; border-radius: .5rem; background: white; font: inherit; }
      button { align-self: end; border-color: #171717; background: #171717; color: white; cursor: pointer; }
      #events { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding-bottom: 3rem; }
      .card { display: grid; gap: .65rem; min-height: 220px; padding: 1.25rem; border: 1px solid #ddd; border-radius: .75rem; background: white; }
      .date, .location, .status { color: #666; }
      .performer { margin: 0; font-size: 1.35rem; }
      .venue { margin: 0; }
      .card a { align-self: end; color: inherit; font-weight: 700; }
      .message { grid-column: 1 / -1; padding: 3rem; text-align: center; color: #666; }
      .error { color: #a22222; }
      @media (max-width: 800px) { form { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 480px) { form { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Live from near you</h1>
      <p>Upcoming shows from current and former SNL performers.</p>
    </header>
    <main>
      <form id="filters">
        <label>Performer
          <select name="performer" id="performer"><option value="">All performers</option></select>
        </label>
        <label>Location
          <input name="location" placeholder="Los Angeles, CA">
        </label>
        <label>Radius (miles)
          <input name="radius" type="number" min="1" max="1000" placeholder="Optional">
        </label>
        <label>From
          <input name="start_date" type="date">
        </label>
        <label>To
          <input name="end_date" type="date">
        </label>
        <label>Sort
          <select name="sort">
            <option value="date_asc">Soonest</option>
            <option value="date_desc">Latest</option>
            <option value="performer">Performer</option>
          </select>
        </label>
        <button type="submit">Find events</button>
      </form>

      <section id="events" aria-live="polite">
        <p class="message">Loading events…</p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#filters");
      const grid = document.querySelector("#events");
      const performerSelect = document.querySelector("#performer");

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = value ?? "";
        return element.innerHTML;
      }

      function safeUrl(value) {
        try {
          const url = new URL(value);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        } catch {
          return "";
        }
      }

      function eventCard(event) {
        const date = event.date
          ? new Date(`${event.date.slice(0, 10)}T12:00:00`).toLocaleDateString(undefined, { dateStyle: "long" })
          : "Date TBA";
        const distance = event.distance_miles == null ? "" : ` · ${event.distance_miles} miles away`;
        const url = safeUrl(event.details_url);
        const link = url
          ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${event.sold_out ? "Details" : "Tickets & details"} →</a>`
          : "";
        return `<article class="card">
          <div class="date">${escapeHtml(date)}</div>
          <h2 class="performer">${escapeHtml(event.performer)}</h2>
          <p class="venue">${escapeHtml(event.venue || "Venue TBA")}</p>
          <div class="location">${escapeHtml(event.location || "Location TBA")}${distance}</div>
          ${event.sold_out ? '<div class="status">Sold out</div>' : ""}
          ${link}
        </article>`;
      }

      async function loadPerformers() {
        const response = await fetch("/performers");
        if (!response.ok) return;
        const performers = await response.json();
        performers.forEach(name => performerSelect.add(new Option(name, name)));
      }

      async function loadEvents() {
        grid.innerHTML = '<p class="message">Loading events…</p>';
        const params = new URLSearchParams();
        new FormData(form).forEach((value, key) => { if (value) params.set(key, value); });

        try {
          const response = await fetch(`/events?${params}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Unable to load events");
          grid.innerHTML = data.length
            ? data.map(eventCard).join("")
            : '<p class="message">No events match these filters.</p>';
        } catch (error) {
          grid.innerHTML = `<p class="message error">${escapeHtml(error.message)}</p>`;
        }
      }

      form.addEventListener("submit", event => { event.preventDefault(); loadEvents(); });
      loadPerformers().catch(() => {});
      loadEvents();
    </script>
  </body>
</html>
